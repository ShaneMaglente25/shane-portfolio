
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser title -->
    <title>
      Shane Danrell Maglente | Developer Portfolio
    </title>

    <!-- Search engine description -->
    <meta
      name="description"
      content="Explore the portfolio of Shane Danrell Maglente, a Computer Science student and developer building practical software applications and exploring full-stack development and AI/ML."
    />

    <!-- Website information -->
    <meta
      name="author"
      content="Shane Danrell D. Maglente"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Browser theme colors -->
    <meta
      name="theme-color"
      content="#F8FAFC"
      media="(prefers-color-scheme: light)"
    />

    <meta
      name="theme-color"
      content="#080D1C"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph: social sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Shane Danrell Maglente"
    />

    <meta
      property="og:title"
      content="Shane Danrell Maglente | Developer Portfolio"
    />

    <meta
      property="og:description"
      content="A Computer Science student and developer passionate about building practical software, learning new technologies, and exploring full-stack development and AI/ML."
    />

    <!-- X / Twitter -->

    <meta
      name="twitter:title"
      content="Shane Danrell Maglente | Developer Portfolio"
    />

    <meta
      name="twitter:description"
      content="Explore my software projects, technical skills, and development journey."
    />


    <!-- Social sharing image -->
    <meta
      property="og:image"
      content="https://shanedanrellmaglente.vercel.app/og-image.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Shane Danrell Maglente — Computer Science Student and Developer"
    />

    <!-- Website URL -->
    <meta
      property="og:url"
      content="https://shanedanrellmaglente.vercel.app/"
    />

    <link
      rel="canonical"
      href="https://shanedanrellmaglente.vercel.app/"
    />

    <!-- Large image preview on X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:image"
      content="https://shanedanrellmaglente.vercel.app/og-image.png"
    />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
